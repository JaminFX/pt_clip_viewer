name: Build and test macOS Universal 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Locate application sources
        shell: bash
        run: |
          if [[ -f build_app.py ]]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [[ -f pt_clip_viewer/build_app.py ]]; then
            echo "APP_DIR=pt_clip_viewer" >> "$GITHUB_ENV"
          else
            echo "Cannot locate pt_clip_viewer sources" >&2
            exit 1
          fi
      - name: Install official universal2 Python
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.python.org/ftp/python/3.14.10/python-3.14.10-macos11.pkg -o "$RUNNER_TEMP/python.pkg"
          echo "286c7018aa2730f6747ca433dccdc2b31be45f078a9ea0ffa44d5f06368fd2d7  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
      - name: Build Universal 2 app and DMG
        shell: bash
        run: |
          cd "$APP_DIR"
          PYTHON=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          "$PYTHON" -m venv .venv-macos
          .venv-macos/bin/python -m pip install --require-hashes -r requirements-build.lock
          .venv-macos/bin/python verify_release.py
          .venv-macos/bin/python verify_universal.py
          .venv-macos/bin/python verify_security.py
          .venv-macos/bin/python tools/runtime_inventory.py release/runtime-inventory-macos.json
          .venv-macos/bin/python build_app.py
          # build_app stages the hash-verified Intel Tcl 9 TkDnD runtime first.
          .venv-macos/bin/python verify_scrolling.py
          .venv-macos/bin/python verify_duplicates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-Universal2-candidate
          path: |
            ${{ env.APP_DIR }}/release/*_macOS_Universal2.dmg
            ${{ env.APP_DIR }}/release/*_Universal2_architectures.json
            ${{ env.APP_DIR }}/release/runtime-inventory-macos.json
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TkDnD9-Intel-source-build
          path: ${{ env.APP_DIR }}/build/tkdnd-vendor/*
          if-no-files-found: warn
          retention-days: 14

  native-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macOS-Universal2-candidate
          path: candidate
      - name: Verify the SAME DMG on the native architecture
        shell: bash
        run: |
          if [[ -f verify_macos_dmg.py ]]; then
            CHECK=verify_macos_dmg.py
          else
            CHECK=pt_clip_viewer/verify_macos_dmg.py
          fi
          python "$CHECK" candidate/*_macOS_Universal2.dmg ui-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: UI-preview-${{ matrix.runner }}
          path: ui-preview/*.png
          if-no-files-found: warn
          retention-days: 14

  verified:
    needs: [build, native-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macOS-Universal2-candidate
          path: verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PT-Clip-Viewer-macOS-Universal2-VERIFIED
          path: verified/*
          if-no-files-found: error
          retention-days: 14
